<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메이즈랜드 · 봉오리와 만개</title><link rel="stylesheet" href="site-nav.css?v=86"><link rel="stylesheet" href="collection.css?v=86"><script defer src="site-nav.js?v=89r1"></script><style>.opening-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opening-pair figure{margin:0}.opening-pair img{width:100%;aspect-ratio:1;object-fit:contain;background:#243c36;border-radius:12px}.opening-pair figcaption{font-size:13px;text-align:center;color:#c6d7bc;padding:8px}.opening-card{padding:22px;border:1px solid #476452;border-radius:16px}.opening-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.opening-card h2{font-size:18px}.opening-meta{font-size:12px;color:#bacdb9}.opening-card a{color:inherit}@media(max-width:720px){.opening-grid{grid-template-columns:1fr}}</style></head><body><main class="collection"><header class="page-heading"><div><p class="eyebrow">SAME FLOWER · BUD TO BLOOM</p><h1>꽃이 깨어나기 전과 후</h1><p class="lead">추상 유화 꽃 48종의 봉오리와 만개 입력을 배경의 빛에 맞춰 정리했습니다.</p></div><a class="button" href="layered-garden.html?v=20261028-v89r1">정원 체험하기 →</a></header><p id="openingStatus" role="status">꽃 입력을 불러오는 중입니다…</p><p class="opening-meta">영상을 생성하기 전의 입력 이미지입니다. 실제 개화와 PNG 알파 시퀀스는 영상 생성·검수를 통과한 항목만 게임에 연결합니다. 수국·유채·메밀·라벤더는 각 작은 꽃의 연결과 위치를 영상 전 구간에서 추가 검토합니다.</p><section id="openingPairs" class="opening-grid"></section></main><script>
fetch('assets/flower-openings-v89/manifest.json?v=89').then(r=>{if(!r.ok)throw Error('입력 목록을 불러오지 못했습니다.');return r.json()}).then(data=>{const items=data.items;if(!Array.isArray(items)||items.length!==48)throw Error('꽃 입력 목록이 다릅니다.');document.getElementById('openingStatus').textContent=items.length+'종 · 같은 꽃의 봉오리/만개 · 개화 영상 검수 통과 '+items.filter(a=>a.status==='passed').length+'종';for(const a of items){const card=document.createElement('article'),title=document.createElement('h2'),meta=document.createElement('p'),pair=document.createElement('div');card.className='opening-card';title.textContent=a.name;meta.className='opening-meta';meta.textContent=a.backgroundId+' / '+a.lightingId+' · 1254×1254 RGBA · Key '+a.keyColor+' · '+(a.status==='passed'?'개화 영상 검수 통과':'영상 생성·검수 전');pair.className='opening-pair';for(const[state,label]of[['bud','봉오리'],['bloom','만개']]){const figure=document.createElement('figure'),link=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption');link.href=a.images[state].original;link.target='_blank';link.rel='noopener';img.src=a.images[state].preview;img.alt=a.name+' '+label;img.loading='lazy';caption.textContent=label+' · PNG 원본 열기';link.append(img);figure.append(link,caption);pair.append(figure)}card.append(title,meta,pair);document.getElementById('openingPairs').append(card)}}).catch(e=>document.getElementById('openingStatus').textContent=e.message);
</script></body></html>
