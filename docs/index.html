<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>메이즈랜드 · 제주 유화 정원</title><style>*{box-sizing:border-box}body{margin:0;background:#10241e;color:#f4f3e8;font:16px/1.5 system-ui}header{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 24px;flex-wrap:wrap}h1{font-size:20px;margin:0}nav{display:flex;gap:7px;flex-wrap:wrap}button,a{font:inherit;color:inherit}button{border:1px solid #789b8a;background:#1d3c31;padding:8px 14px;border-radius:20px;cursor:pointer}button[aria-pressed=true]{background:#d8e5c6;color:#123025}a{margin-right:12px}main{min-height:calc(100dvh - 130px);display:grid;place-items:center}figure{margin:0;width:100%;aspect-ratio:14165/3480;background:#18382c}img{display:block;width:100%;height:100%;object-fit:contain}footer{padding:14px 24px;color:#bccfbf}#status{font-size:14px}body.embed header,body.embed footer{display:none}body.embed main{min-height:0;height:100dvh}body.embed figure{max-height:100dvh}body.embed img{object-fit:contain}@media(max-width:600px){header{padding:14px}h1{font-size:18px}button{padding:7px 10px}main{min-height:65dvh}}</style><link rel="stylesheet" href="site-nav.css?v=37"><script defer src="site-nav.js?v=44"></script></head><body><header><h1>메이즈랜드 · 제주 유화 정원</h1><nav aria-label="정원 시간대" id="themes"></nav><nav><a href="oil-gallery.html">PNG 소재</a><a href="editor.html">에디터</a><button id="fullscreen" type="button">전체 화면</button></nav></header><main><figure><img id="garden" alt="" decoding="async" fetchpriority="high"></figure></main><footer><span id="description"></span><div id="status" role="status"></div></footer><script>
const scenes=[{"id": "sunset", "name": "노을 · 레드", "flowers": ["동백꽃 A · 진홍", "동백꽃 B · 빨강", "메밀꽃 A · 붉은 분홍", "메밀꽃 B · 붉은 분홍"], "image": "https://lixkizqprsbnsnozwbpa.supabase.co/storage/v1/object/public/jeju-maze-v14/sunset_integrated_open_20261021_v19.webp"}, {"id": "day", "name": "낮 · 옐로우", "flowers": ["금잔화 A · 황금노랑", "금잔화 B · 황금노랑", "유채꽃 A · 레몬노랑", "유채꽃 B · 선명한 노랑"], "image": "https://lixkizqprsbnsnozwbpa.supabase.co/storage/v1/object/public/jeju-maze-v14/day_integrated_open_20261021_v19.webp"}, {"id": "night", "name": "밤 · 퍼플", "flowers": ["라벤더 A · 연보라", "라벤더 B · 짙은 보라", "수국 A · 라일락", "수국 B · 보라"], "image": "https://lixkizqprsbnsnozwbpa.supabase.co/storage/v1/object/public/jeju-maze-v14/night_integrated_open_20261021_v19.webp"}, {"id": "morning", "name": "아침 · 블루", "flowers": ["수국 · 스카이블루", "수국 · 코발트", "수국 · 흰색"], "image": "https://lixkizqprsbnsnozwbpa.supabase.co/storage/v1/object/public/jeju-maze-v14/morning_integrated_open_20261021_v19.webp"}],params=new URLSearchParams(location.search),image=document.getElementById('garden'),host=document.getElementById('themes');if(params.get('embed')==='1')document.body.classList.add('embed');
function show(id){const s=scenes.find(s=>s.id===id)||scenes[0];image.alt=s.name+' 제주 유화 정원';image.src=s.image;document.getElementById('description').textContent=s.name+' · '+s.flowers.join(' / ');document.getElementById('status').textContent='이미지를 불러오는 중입니다.';for(const b of host.children)b.setAttribute('aria-pressed',String(b.dataset.theme===s.id));const u=new URL(location.href);u.searchParams.set('theme',s.id);history.replaceState(null,'',u)}
for(const s of scenes){const b=document.createElement('button');b.type='button';b.textContent=s.name;b.dataset.theme=s.id;b.onclick=()=>show(s.id);host.append(b)}image.onload=()=>document.getElementById('status').textContent='';image.onerror=()=>document.getElementById('status').textContent='이미지를 불러오지 못했습니다. 새로고침해 주세요.';document.getElementById('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();show(params.get('theme'));
</script></body><script src="image-preview.js"></script></html>
