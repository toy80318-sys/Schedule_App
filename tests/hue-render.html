<!doctype html><html lang="ko"><meta charset="utf-8"><title>Flower hue render check</title><style>body{background:#26302b;color:white;font:18px system-ui}canvas{width:720px;height:160px;image-rendering:pixelated}</style><h1>Flower Hue · RGB and alpha check</h1><canvas id="canvas" width="240" height="80"></canvas><pre id="results">Loading</pre><script src="../docs/flower-hue.js"></script><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),source=document.createElement('canvas');source.width=240;source.height=40;const base=source.getContext('2d'),colors=['rgb(220,50,90)','rgb(60,100,220)','rgb(30,130,40)','rgb(240,190,40)','rgba(30,130,40,.5)','rgba(220,50,90,.5)'];colors.forEach((color,i)=>{base.fillStyle=color;base.fillRect(i*40,0,40,40)});ctx.drawImage(source,0,0);ctx.filter=jejuFlowerHue.css(10);ctx.drawImage(source,0,40);const before=colors.map((_,i)=>Array.from(ctx.getImageData(i*40+20,20,1,1).data)),after=colors.map((_,i)=>Array.from(ctx.getImageData(i*40+20,60,1,1).data));const greenSame=[2,4].every(i=>before[i].every((v,c)=>Math.abs(v-after[i][c])<=1)),alphaSame=before.every((p,i)=>Math.abs(p[3]-after[i][3])<=1),petalsChanged=[0,1,3].every(i=>before[i].some((v,c)=>c<3&&Math.abs(v-after[i][c])>3));document.getElementById('results').textContent=JSON.stringify({status:greenSame&&alphaSame&&petalsChanged?'PASS':'FAIL',greenSame,alphaSame,petalsChanged,before,after},null,2);
</script></html>
